asyncapi: 3.1.0
info:
  title: Drainage Monitoring IoT System
  version: 1.0.0
  description: 'Sistem monitoring drainase berbasis IoT yang menggunakan MQTT untuk
    ingest data sensor dan WebSocket untuk real-time streaming ke aplikasi mobile.


    ## 🔌 MQTT Configuration (.env)

    - MQTT_BROKER: broker EMQX / private broker

    - MQTT_BASE_TOPIC: compro9.26.telyu-iot-drainage-be


    ## ⚡ Flow

    Device → MQTT → Backend → InfluxDB + WebSocket → Mobile App'
servers:
  mqttBroker:
    url: broker.emqx.io:1883
    protocol: mqtt
    description: Public MQTT broker (EMQX) — backend menjadi subscriber pada tiga
      sub-topic di bawah base topic MQTT_BASE_TOPIC.
  websocketServer:
    url: ws://localhost:3000/ws
    protocol: ws
    description: WebSocket endpoint untuk client mobile/dashboard.
channels:
  compro9.26.telyu-iot-drainage-be/sensor-data:
    description: Channel untuk pengiriman data sensor dari device IoT
    publish:
      summary: IoT device mengirim data sensor
      operationId: publishSensorData
      message:
        $ref: '#/components/messages/SensorDataMessage'
  compro9.26.telyu-iot-drainage-be/sensor-log:
    description: Channel untuk pengiriman log sistem dari device IoT
    publish:
      summary: IoT device mengirim sensor log
      operationId: publishSensorLog
      message:
        $ref: '#/components/messages/SensorLogMessage'
  compro9.26.telyu-iot-drainage-be/device-info:
    description: Channel untuk pengiriman info perangkat dan commissioning
    publish:
      summary: IoT device mengirim device-info
      operationId: publishDeviceInfo
      message:
        $ref: '#/components/messages/DeviceInfoMessage'
  ws:
    description: Channel untuk streaming data sensor dan alert ke client mobile secara
      real-time
    subscribe:
      summary: Client menerima data sensor realtime dan alert
      operationId: receiveRealtimeMessages
      message:
        oneOf:
        - $ref: '#/components/messages/WebSocketSensorMessage'
        - $ref: '#/components/messages/WebSocketAlertMessage'
components:
  messages:
    SensorDataMessage:
      name: SensorDataMessage
      title: Sensor Data Payload
      summary: Payload data sensor dari device IoT
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SensorDataRequest'
    SensorLogMessage:
      name: SensorLogMessage
      title: Sensor Log Payload
      summary: Payload log sistem dari device IoT
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SensorLogRequest'
    DeviceInfoMessage:
      name: DeviceInfoMessage
      title: Device Info Payload
      summary: Payload info perangkat dari device IoT
      contentType: application/json
      payload:
        $ref: '#/components/schemas/DeviceInfoRequest'
    WebSocketSensorMessage:
      name: WebSocketSensorMessage
      title: WebSocket Sensor Message
      summary: Real-time sensor data
      contentType: application/json
      payload:
        type: object
        properties:
          type:
            type: string
            example: sensor
          data:
            $ref: '#/components/schemas/WebSocketSensorData'
        required:
        - type
        - data
    WebSocketAlertMessage:
      name: WebSocketAlertMessage
      title: WebSocket Alert Message
      summary: Alert ketika terjadi kondisi abnormal
      contentType: application/json
      payload:
        type: object
        properties:
          type:
            type: string
            example: alert
          data:
            $ref: '#/components/schemas/WebSocketAlertData'
        required:
        - type
        - data
  schemas:
    SensorDataRequest:
      type: object
      properties:
        device_id:
          type: string
          example: dev01
        water_distance:
          type: number
          example: 14.2
        water_level_cm:
          type: number
          example: 35.8
        status:
          type: string
          example: NORMAL
          enum:
          - NORMAL
          - WASPADA
          - BAHAYA
        rain_detected:
          type: boolean
          example: true
        sensor_flag:
          type: string
          example: OK
        timestamp:
          type: integer
          example: 1714039200
        next_wakeup_sec:
          type: integer
          example: 60
      required:
      - device_id
      - water_distance
      - water_level_cm
      - status
      - rain_detected
      - timestamp
      - next_wakeup_sec
    SensorLogRequest:
      type: object
      properties:
        device_id:
          type: string
          example: dev01
        timestamp:
          type: integer
          example: 1714039200
        level:
          type: string
          example: INFO
          enum:
          - INFO
          - WARNING
          - ERROR
        message:
          type: string
          example: Sensor boot completed
        wake_reason:
          type: string
          example: timer
        reset_reason:
          type: string
          example: power_on
        active_time_ms:
          type: integer
          example: 1200
        wifi_rssi_dbm:
          type: integer
          example: -61
        network_failures:
          type: integer
          example: 0
        free_heap_bytes:
          type: integer
          example: 123456
      required:
      - device_id
      - timestamp
      - level
      - message
    DeviceInfoRequest:
      type: object
      properties:
        device_id:
          type: string
          example: dev01
        ip_address:
          type: string
          example: 192.168.1.50
        location:
          type: string
          example: Gate A Drainage
        timestamp:
          type: integer
          example: 1714039200
      required:
      - device_id
      - ip_address
      - location
      - timestamp
    WebSocketSensorData:
      type: object
      properties:
        payload:
          $ref: '#/components/schemas/SensorDataRequest'
        timestamp:
          type: integer
          example: 1714039200
      required:
      - payload
      - timestamp
    WebSocketAlertData:
      type: object
      properties:
        alert:
          type: string
          example: BAHAYA
        payload:
          $ref: '#/components/schemas/SensorDataRequest'
        timestamp:
          type: integer
          example: 1714039200
      required:
      - alert
      - payload
      - timestamp
